<style>

:root {
  --brand-primary: #b3005e; --brand-hover: #99004f; --brand-secondary: #f7a8cd; --brand-tertiary: #fde7f1; --brand-muted: #c76a97;
  --success: #8fbb74; --success-text: #4d7a33; --warning: #f9da84; --warning-text: #8a6410; --danger: #e5484d; --danger-text: #b3262b;
  --surface-bg: #ffffff; --surface-hover: #fdf0f6; --bg-faint: #b3005e0a; --border-primary: #b3005e1f; --border-input: #b3005e8c;
  --text-primary: #2b1f28; --text-secondary: #2b1f28b8; --text-tertiary: #2b1f28a6; --pastel-tile: #fde7f1; --on-brand: #ffffff;
  --chart-in: #b3005e; --chart-out: #e8a020;
  --asset-property: #7d0040; --asset-pensions: #2b8a9e; --asset-investments: #6f9e57; --asset-cash: #e8a020; --asset-other: #f2a9cf; --asset-debt: #8a7f86;
  --page-base: #ffffff;
  --gradient-page: linear-gradient(160deg, rgba(227,50,146,0.14) 0%, rgba(249,145,175,0.08) 45%, rgba(249,218,132,0.16) 100%);
  --gradient-hero: linear-gradient(135deg, #c0126f 0%, #d0306a 55%, #c4501a 125%);
  --shadow: 0 12px 32px rgba(43,31,40,0.16);
  --corner-md: 10px;
  --corner-lg: 20px;
  --font: "Instrument Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --brand-primary: #f37bb0; --brand-hover: #f79ac4; --brand-secondary: #7d0040; --brand-tertiary: #2b111f; --brand-muted: #c76a97;
    --success-text: #a9d38f; --warning-text: #f3cf6b; --danger-text: #ff8b8e;
    --surface-bg: #2a1621; --surface-hover: #361d2b; --bg-faint: #ffffff0d; --border-primary: #ffffff1f; --border-input: #ffffff59;
    --text-primary: #f6eaf0; --text-secondary: #f6eaf0b3; --text-tertiary: #f6eaf080; --pastel-tile: #45203a; --on-brand: #2b111f;
    --chart-in: #f37bb0; --chart-out: #f2b84b; --asset-property: #d0578f; --asset-other: #f7c3dc; --asset-debt: #a89aa2;
    --page-base: #1c0f16;
    --gradient-page: linear-gradient(160deg, rgba(227,50,146,0.16) 0%, rgba(249,145,175,0.05) 45%, rgba(249,218,132,0.08) 100%);
    --shadow: 0 12px 32px rgba(0,0,0,0.5);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
    --brand-primary: #f37bb0; --brand-hover: #f79ac4; --brand-secondary: #7d0040; --brand-tertiary: #2b111f; --brand-muted: #c76a97;
    --success-text: #a9d38f; --warning-text: #f3cf6b; --danger-text: #ff8b8e;
    --surface-bg: #2a1621; --surface-hover: #361d2b; --bg-faint: #ffffff0d; --border-primary: #ffffff1f; --border-input: #ffffff59;
    --text-primary: #f6eaf0; --text-secondary: #f6eaf0b3; --text-tertiary: #f6eaf080; --pastel-tile: #45203a; --on-brand: #2b111f;
    --chart-in: #f37bb0; --chart-out: #f2b84b; --asset-property: #d0578f; --asset-other: #f7c3dc; --asset-debt: #a89aa2;
    --page-base: #1c0f16;
    --gradient-page: linear-gradient(160deg, rgba(227,50,146,0.16) 0%, rgba(249,145,175,0.05) 45%, rgba(249,218,132,0.08) 100%);
    --shadow: 0 12px 32px rgba(0,0,0,0.5);
    color-scheme: dark;
}
:root { box-sizing: border-box; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
html { scroll-padding-top: env(safe-area-inset-top, 0px); height: 100%; }
*, *::before, *::after { box-sizing: inherit; }
body { margin: 0; min-height: 100%; background-color: var(--page-base); background-image: var(--gradient-page); background-attachment: fixed; color: var(--text-primary); font-family: var(--font); font-size: 14px; line-height: 1.45; -webkit-font-smoothing: antialiased; }
button, input, select { font: inherit; color: inherit; }
img, svg { max-width: 100%; }
.ico { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }
:focus-visible { outline: 2px solid var(--brand-primary); outline-offset: 2px; }

/* Layout */
.app { display: flex; min-height: 100vh; }
.rail { width: 72px; background: var(--surface-bg); border-right: 1px solid var(--border-primary); display: flex; flex-direction: column; align-items: center; padding: 20px 0; gap: 8px; position: sticky; top: 0; height: 100vh; }
.rail .mark { width: 36px; height: 36px; border-radius: 12px; background: var(--brand-primary); color: var(--on-brand); display: grid; place-items: center; font-weight: 700; margin-bottom: 16px; }
.rail-btn { width: 44px; height: 44px; border-radius: var(--corner-md); border: 0; background: transparent; display: grid; place-items: center; color: var(--text-secondary); cursor: pointer; }
.rail-btn .ico { width: 20px; height: 20px; stroke-width: 1.5; }
.rail-btn:hover { background: var(--surface-hover); }
.rail-btn[aria-current="page"] { background: var(--pastel-tile); color: var(--brand-primary); }
.rail .spacer { flex: 1; }
.avatar { width: 36px; height: 36px; border-radius: 50%; background: var(--brand-secondary); color: var(--brand-primary); display: grid; place-items: center; font-size: 12px; font-weight: 600; overflow: hidden; }
.avatar img { width: 100%; height: 100%; object-fit: cover; }
main { flex: 1; min-width: 0; padding: 32px clamp(20px, 3vw, 48px); }

/* Type */
h1 { font-size: 28px; line-height: 1.2; font-weight: 600; margin: 0; letter-spacing: -0.01em; }
h2 { font-size: 16px; font-weight: 600; margin: 0; }
h3 { font-size: 14px; font-weight: 600; margin: 0; }
.big { font-size: 26px; font-weight: 600; line-height: 1.2; letter-spacing: -0.01em; font-variant-numeric: tabular-nums; }
.num { font-variant-numeric: tabular-nums; }
.sm { font-size: 12px; }
.muted { color: var(--text-secondary); }
.faint { color: var(--text-tertiary); }
.brand { color: var(--brand-primary); }
.pos { color: var(--success-text); }
.neg { color: var(--danger-text); }
p { margin: 0; }

/* Header */
.page-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; margin-bottom: 24px; flex-wrap: wrap; }
.page-head .sub { margin-top: 4px; }
.head-actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

/* Buttons */
.btn { display: inline-flex; align-items: center; gap: 6px; border: 0; border-radius: var(--corner-md); padding: 9px 14px; font-weight: 500; cursor: pointer; white-space: nowrap; }
.btn-primary { background: var(--brand-primary); color: var(--on-brand); }
.btn-primary:hover { background: var(--brand-hover); }
.btn-neutral { background: var(--surface-bg); border: 1px solid var(--border-primary); }
.btn-neutral:hover { background: var(--surface-hover); }
.btn-subtle { background: transparent; color: var(--text-secondary); padding: 6px 10px; }
.btn-subtle:hover { background: var(--surface-hover); color: var(--text-primary); }
.btn-danger { background: transparent; color: var(--danger-text); border: 1px solid currentColor; }
.btn-danger.armed { background: var(--danger); color: #fff; border-color: var(--danger); }
.icon-btn { width: 32px; height: 32px; border-radius: var(--corner-md); border: 0; background: transparent; display: grid; place-items: center; color: var(--text-secondary); cursor: pointer; }
.icon-btn:hover { background: var(--surface-hover); color: var(--text-primary); }
.mobile-only { display: none; }

/* Segmented filter */
.seg { display: inline-flex; background: var(--surface-bg); border: 1px solid var(--border-primary); border-radius: var(--corner-md); padding: 3px; gap: 2px; }
.seg button { border: 0; background: transparent; padding: 6px 12px; border-radius: 7px; cursor: pointer; color: var(--text-secondary); font-weight: 500; }
.seg button[aria-pressed="true"] { background: var(--pastel-tile); color: var(--brand-primary); }

/* Cards */
.card { background: var(--surface-bg); border-radius: var(--corner-lg); padding: 24px; }
.grid { display: grid; gap: 24px; }
.g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.stack { display: flex; flex-direction: column; gap: 24px; }
.kpi-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; gap: 8px; min-height: 24px; }
.tile { background: var(--bg-faint); border-radius: var(--corner-md); padding: 16px; }
.tile.selected { box-shadow: inset 0 0 0 1.5px var(--brand-secondary); }

/* Badges */
.badge { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 999px; font-size: 12px; font-weight: 500; white-space: nowrap; }
.badge.success { background: color-mix(in srgb, var(--success) 25%, transparent); color: var(--success-text); }
.badge.warning { background: color-mix(in srgb, var(--warning) 40%, transparent); color: var(--warning-text); }
.badge.danger { background: color-mix(in srgb, var(--danger) 25%, transparent); color: var(--danger-text); }
.badge.default { background: var(--bg-faint); color: var(--text-secondary); }
.badge.brand { background: var(--pastel-tile); color: var(--brand-primary); }

/* Bars */
.bar { height: 6px; background: var(--bg-faint); border-radius: 999px; overflow: hidden; }
.bar > span { display: block; height: 100%; border-radius: 999px; background: var(--brand-primary); transition: width .3s; }
.bar > span.warn { background: var(--warning); }
.bar > span.ok { background: var(--success); }
.tile .bar { background: var(--surface-bg); }
.row-between { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.mb-xs { margin-bottom: 4px; } .mt-xs { margin-top: 4px; } .mb-md { margin-bottom: 12px; } .mb-lg { margin-bottom: 16px; } .mt-md { margin-top: 12px; } .mt-lg { margin-top: 16px; }

/* Tabs */
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--border-primary); margin: 32px 0 24px; overflow-x: auto; }
.tabs button { border: 0; background: transparent; padding: 10px 14px; cursor: pointer; color: var(--text-secondary); font-weight: 500; border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; }
.tabs button[aria-selected="true"] { color: var(--brand-primary); border-bottom-color: var(--brand-primary); }

/* Sections & rows */
.sec-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; gap: 12px; }
.sec-title { display: flex; align-items: center; gap: 12px; }
.icon-tile { width: 32px; height: 32px; border-radius: var(--corner-md); background: var(--pastel-tile); color: var(--brand-primary); display: grid; place-items: center; flex-shrink: 0; }
.rows { display: flex; flex-direction: column; gap: 2px; }
.item-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px; border-radius: var(--corner-md); width: 100%; border: 0; background: transparent; text-align: left; cursor: pointer; }
.item-row:hover { background: var(--surface-hover); }
.item-row[disabled] { cursor: default; }
.item-row[disabled]:hover { background: transparent; }
.item-row .r { text-align: right; flex-shrink: 0; }
.item-row .chg { display: inline-flex; align-items: center; gap: 4px; justify-content: flex-end; }
.chg .ico { width: 12px; height: 12px; }
.facts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin-top: 12px; width: 100%; }
.facts .tile { padding: 10px 12px; }
.liab { flex-direction: column; align-items: stretch; }
.empty { padding: 12px; color: var(--text-secondary); display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; border: 1px dashed var(--border-primary); border-radius: var(--corner-md); }
.owner-chip { font-size: 11px; font-weight: 600; padding: 1px 7px; border-radius: 999px; background: var(--pastel-tile); color: var(--brand-primary); margin-left: 6px; vertical-align: 1px; }

/* Month-by-month balance sheet. The scroll box is right-to-left so phones open on the newest months. */
.kpi-chg { display: flex; align-items: center; gap: 4px; }
.kpi-chg .ico { width: 12px; height: 12px; }
.wb-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 16px; }
.wb-sum { text-align: right; }
.wb-sum .badge { vertical-align: 2px; margin-left: 4px; }
.wb-scroll { overflow-x: auto; direction: rtl; }
.wb { direction: ltr; width: 100%; border-collapse: separate; border-spacing: 0; font-variant-numeric: tabular-nums; }
.wb th, .wb td { padding: 10px 12px; text-align: right; white-space: nowrap; vertical-align: top; font-weight: 400; }
.wb td { min-width: 104px; }
.wb thead th + th { width: 120px; }
.wb thead th { font-size: 12px; font-weight: 500; color: var(--text-secondary); padding-top: 10px; padding-bottom: 10px; border-bottom: 1px solid var(--border-primary); }
.wb thead th:first-child, .wb tbody th { position: sticky; left: 0; z-index: 1; background: var(--surface-bg); text-align: left; }
.wb tbody th { min-width: 180px; font-weight: 500; }
.wb .now { background: var(--bg-faint); }
.wb thead th.now { color: var(--text-primary); font-weight: 600; border-radius: var(--corner-md) var(--corner-md) 0 0; }
.wb tr.net td.now { border-radius: 0 0 var(--corner-md) var(--corner-md); }
.wb .v { display: block; }
.wb .d { display: block; font-size: 12px; font-weight: 400; margin-top: 2px; }
.wb tr.sec th { padding-top: 20px; padding-bottom: 4px; font-size: 12px; font-weight: 600; color: var(--text-secondary); }
.wb tr.tot th, .wb tr.tot td, .wb tr.net th, .wb tr.net td { font-weight: 600; border-top: 1px solid var(--border-primary); }
.wb tr.net th, .wb tr.net td { padding-top: 14px; padding-bottom: 14px; }
.wb tr.net .v { color: var(--brand-primary); font-size: 16px; }
.wb tr.it th, .wb tr.it td { font-size: 13px; padding-top: 6px; padding-bottom: 6px; }
.wb tr.it th { font-weight: 400; padding-left: 52px; white-space: normal; }
.wb tr.it th span { display: block; }
.wb tr.it .v { color: var(--text-secondary); }
.wb-sub { font-size: 12px; color: var(--text-tertiary); }
.wb-tog { display: inline-flex; align-items: center; gap: 8px; background: none; border: 0; padding: 0; font: inherit; color: inherit; text-align: left; }
button.wb-tog { cursor: pointer; }
@media (hover: hover) { button.wb-tog:hover span { color: var(--brand-primary); } }
.wb-range button { white-space: nowrap; flex: none; padding-left: 12px; padding-right: 12px; }
.wb-tog .ico { width: 14px; height: 14px; color: var(--text-tertiary); transition: transform .2s; }
.wb-tog[aria-expanded="true"] .ico { transform: rotate(90deg); }
.wb-sp { width: 14px; flex-shrink: 0; }
.dot { width: 10px; height: 10px; border-radius: 3px; display: inline-block; flex-shrink: 0; }
.wb-hint { display: none; margin-bottom: 8px; }
@media (max-width: 640px) {
  .wb-hint { display: block; }
  .wb-sum { text-align: left; }
  .wb th, .wb td { padding-left: 8px; padding-right: 8px; }
  .wb td { min-width: 92px; }
  .wb tbody th { min-width: 136px; max-width: 150px; white-space: normal; }
  .wb tr.it th { padding-left: 38px; }
  .wb-tog { gap: 6px; }
}

/* Notice */
.notice { background: var(--surface-bg); border-radius: var(--corner-md); padding: 12px 16px; margin-bottom: 24px; border-left: 3px solid var(--warning); }
.loading { padding: 48px 0; text-align: center; color: var(--text-secondary); }

/* Dialogs */
dialog { border: 0; border-radius: var(--corner-lg); padding: 0; width: min(480px, calc(100vw - 32px)); background: var(--surface-bg); color: var(--text-primary); box-shadow: var(--shadow); max-height: calc(100vh - 48px); }
dialog::backdrop { background: rgba(20, 5, 77, 0.35); }
.dlg-head { display: flex; align-items: center; justify-content: space-between; padding: 20px 24px 8px; }
.dlg-body { padding: 8px 24px 16px; display: flex; flex-direction: column; gap: 14px; }
.dlg-foot { display: flex; justify-content: space-between; gap: 8px; padding: 16px 24px 20px; border-top: 1px solid var(--border-primary); flex-wrap: wrap; }
.dlg-foot .right { display: flex; gap: 8px; margin-left: auto; }
.field { display: flex; flex-direction: column; gap: 6px; }
.field label { font-weight: 500; font-size: 13px; }
.field .hint { font-size: 12px; color: var(--text-secondary); }
.field input, .field select { border: 1px solid var(--border-primary); background: var(--surface-bg); border-radius: var(--corner-md); padding: 9px 12px; width: 100%; min-width: 0; }
.field input:focus, .field select:focus { outline: 2px solid var(--brand-primary); outline-offset: -1px; }
.money { position: relative; }
.money::before { content: "£"; position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--text-secondary); pointer-events: none; }
.money input { padding-left: 26px; }
/* Monthly value update at the top of the edit window */
.value-top { background: var(--bg-faint); border-radius: var(--corner-md); padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; }
.value-top h3 { font-size: 15px; }
.value-top #valueField .money input { font-size: 18px; font-weight: 600; padding-top: 10px; padding-bottom: 10px; }
.value-top #valueField .money input::placeholder { color: var(--text-tertiary); font-weight: 500; }
.value-chg { font-weight: 600; }
.details-head { font-size: 13px; color: var(--text-secondary); margin-top: 6px; }
.value-keep { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
#valueStep .link { font-size: 12px; }
/* What's left in this month's update */
.upd-strip { display: flex; align-items: center; gap: 16px; background: var(--surface-bg); border-radius: var(--corner-lg); padding: 16px 24px; margin-top: 24px; }
.upd-strip .upd-text { flex: 1; min-width: 0; }
.upd-strip .bar { margin-top: 8px; max-width: 360px; }
.upd-strip.done { color: var(--success-text); }
.upd-strip.done .ico { width: 20px; height: 20px; }
.upd-chip { margin-top: 6px; }
.upd-done { display: flex; align-items: center; gap: 4px; margin-top: 4px; }
.upd-done .ico { width: 12px; height: 12px; }
.wb .upd-not, .warn-text { color: var(--warning-text); }
.item-row .go { color: var(--text-tertiary); align-self: center; display: flex; }
.item-row.liab .go { align-self: flex-start; padding-top: 2px; }
@media (max-width: 640px) {
  .upd-strip { flex-direction: column; align-items: stretch; padding: 16px; }
  .upd-strip .bar { max-width: none; }
  .upd-strip .btn { justify-content: center; }
}
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.err { color: var(--danger-text); font-size: 12px; }
[hidden] { display: none !important; }

@media (max-width: 900px) {
  .g3 { grid-template-columns: 1fr; }
  .g2 { grid-template-columns: 1fr; }
  .kpis { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
  .kpis .card { padding: 16px; }
  .kpis .big { font-size: 20px; }
}
@media (max-width: 640px) {
  .rail { display: none; }
  .mobile-only { display: grid; }
  main { padding: 20px 16px 40px; }
  h1 { font-size: 24px; }
  .kpis { grid-template-columns: 1fr; }
  .kpis .card .kpi-head { margin-bottom: 8px; }
  .card { padding: 18px; }
  .facts { grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
  .head-actions { width: 100%; }
  .head-actions .btn-primary { flex: 1; justify-content: center; }
  .head-actions .seg { order: 3; width: 100%; }
  .seg button { flex: 1; padding: 7px 6px; }
  .dup { display: none; }
  .two { grid-template-columns: 1fr; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }


.g4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.span2 { grid-column: span 2; }
.hero { background: var(--gradient-hero); color: #fff; border-radius: var(--corner-lg); padding: 24px; position: relative; overflow: hidden; }
.hero .muted, .hero .sm { color: #fff; }
.hero .big { font-size: 34px; }
.hero .badge { background: rgba(255,255,255,0.12); color: #fff; }
.ring-wrap { display: flex; align-items: center; gap: 16px; margin-top: 20px; padding-top: 20px; border-top: 1px solid rgba(255,255,255,0.2); }
.ring { width: 96px; height: 96px; position: relative; flex-shrink: 0; }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring .lbl { position: absolute; inset: 0; display: grid; place-items: center; font-weight: 600; font-size: 20px; }
.chart svg:not(.ico) { width: 100%; height: auto; display: block; }
.chart .hit { cursor: pointer; }
.legend { display: flex; gap: 16px; flex-wrap: wrap; margin-bottom: 8px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-secondary); }
.legend i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
.tx-row { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: var(--corner-md); width: 100%; border: 0; background: transparent; text-align: left; cursor: pointer; }
.tx-row:hover { background: var(--surface-hover); }
.tx-row[disabled] { cursor: default; } .tx-row[disabled]:hover { background: transparent; }
.tx-row .main { flex: 1; min-width: 0; }
.tx-row .main p:first-child { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tx-row .amt { font-weight: 600; font-variant-numeric: tabular-nums; flex-shrink: 0; }
.icon-tile.sm { width: 32px; height: 32px; }
.icon-tile.danger { color: var(--danger-text); }
.icon-tile.ok { color: var(--success-text); }
.todo { display: flex; align-items: center; gap: 12px; padding: 8px 12px; border-radius: var(--corner-md); }
.todo:hover { background: var(--surface-hover); }
.todo label { flex: 1; display: flex; align-items: center; gap: 10px; cursor: pointer; min-width: 0; }
.todo input[type=checkbox] { width: 18px; height: 18px; accent-color: var(--brand-primary); flex-shrink: 0; }
.todo.done .txt { text-decoration: line-through; color: var(--text-tertiary); }
.todo select { border: 1px solid var(--border-primary); background: var(--surface-bg); border-radius: 8px; padding: 4px 6px; font-size: 12px; max-width: 110px; }
.add-row { display: flex; gap: 8px; margin-bottom: 12px; }
/* To-do tags: a coloured dot, the tag name as a small pill-shaped picker, and filter buttons */
.tag-pick { position: relative; display: inline-flex; align-items: center; flex-shrink: 0; }
.tag-pick::before { content: ""; position: absolute; left: 9px; width: 8px; height: 8px; border-radius: 2px; background: var(--tag, transparent); pointer-events: none; }
.tag-pick select, .todo .tag-pick select { border: 1px solid var(--border-primary); background: var(--surface-bg); border-radius: 999px; padding: 4px 8px 4px 22px; font-size: 12px; max-width: 130px; color: var(--text-primary); cursor: pointer; }
.tag-pick.untagged::before { display: none; }
.tag-pick.untagged select { padding-left: 10px; color: var(--text-tertiary); border-style: dashed; }
.add-row .tag-pick select { height: 100%; padding-top: 0; padding-bottom: 0; }
.tag-filters { display: flex; gap: 6px; flex-wrap: wrap; margin: 0 0 10px; }
.tag-filter { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--border-primary); background: var(--surface-bg); border-radius: 999px; padding: 4px 10px; font-size: 12px; cursor: pointer; color: var(--text-secondary); }
.tag-filter i { width: 8px; height: 8px; border-radius: 2px; background: var(--tag); display: inline-block; }
.tag-filter .num { color: var(--text-tertiary); }
.tag-filter[aria-pressed="true"] { background: var(--pastel-tile); color: var(--brand-primary); border-color: var(--brand-secondary); }
.tag-filter[aria-pressed="true"] .num { color: var(--brand-primary); }
@media (max-width: 640px) {
  /* On phones the to-do gets its own line, with its tag and who-picker underneath */
  .todo label { flex: 1 1 100%; }
  .todo .tag-pick { margin-left: 28px; }
  .add-row { flex-wrap: wrap; }
  .card .add-row input { flex: 1 1 100%; }
  .card .add-row .tag-pick { flex: 1; }
  .add-row .tag-pick select { width: 100%; max-width: none; min-height: 38px; }
}
.add-row input { flex: 1; min-width: 0; border: 1px solid var(--border-primary); background: var(--surface-bg); border-radius: var(--corner-md); padding: 9px 12px; }
.filters { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
.filters input, .filters select { border: 1px solid var(--border-primary); background: var(--surface-bg); border-radius: var(--corner-md); padding: 8px 12px; min-width: 0; }
.filters input { flex: 1 1 200px; }
.filters .filter-clear { padding: 8px 4px; white-space: nowrap; }
.cat-chip { font-size: 11px; font-weight: 500; padding: 1px 7px; border-radius: 999px; background: var(--bg-faint); color: var(--text-secondary); margin-left: 6px; }
.pot-card { display: flex; flex-direction: column; gap: 14px; }
.pot-add { border: 1.5px dashed var(--border-primary); background: transparent; border-radius: var(--corner-lg); min-height: 200px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; cursor: pointer; color: var(--text-secondary); }
.pot-add:hover { background: var(--surface-bg); }
.acc-card { border: 1px solid var(--border-primary); border-radius: var(--corner-lg); padding: 18px; background: var(--surface-bg); text-align: left; cursor: pointer; width: 100%; }
.acc-card:hover { background: var(--surface-hover); }
.acc-card[disabled] { cursor: default; }
.checks { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 12px; }
.checks label, .check-one { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 400; cursor: pointer; }
.checks input, .check-one input { accent-color: var(--brand-primary); width: 16px; height: 16px; }
.preview { width: 100%; border-collapse: collapse; font-size: 12px; }
.preview td, .preview th { padding: 6px 8px; border-bottom: 1px solid var(--border-primary); text-align: left; white-space: nowrap; }
.preview td.desc { max-width: 160px; overflow: hidden; text-overflow: ellipsis; }
.scroll-x { overflow-x: auto; }
.st-tile { gap: 16px; }
.st-or { margin: 4px 0 -4px; }
.st-acc { border: 1px solid var(--border-primary); border-radius: var(--corner-md); padding: 12px; display: flex; flex-direction: column; gap: 10px; }
.st-note { margin-bottom: 0; }
.st-lines { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 4px; }
.drop { border: 1.5px dashed var(--border-primary); border-radius: var(--corner-md); padding: 24px; text-align: center; }
.drop input { margin-top: 12px; max-width: 100%; }
.ok-box { background: color-mix(in srgb, var(--success) 20%, transparent); border-radius: var(--corner-md); padding: 12px; }
.bnav { display: none; }
dialog.wide { width: min(640px, calc(100vw - 24px)); }
.link { background: none; border: 0; padding: 0; color: var(--brand-primary); cursor: pointer; font-weight: 500; }
.danger-zone { border: 1px solid var(--danger); }
.danger-zone h3 { color: var(--danger-text); }
.btn-destroy { background: #b3262b; color: #fff; }
.btn-destroy:hover { background: #8f1c20; }
@media (max-width: 900px) {
  .g4 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .span2 { grid-column: auto; }
}
@media (max-width: 640px) {
  .bnav { display: flex; position: fixed; left: 0; right: 0; bottom: 0; background: var(--surface-bg); border-top: 1px solid var(--border-primary); padding: 6px 4px calc(6px + env(safe-area-inset-bottom, 0px)); z-index: 20; justify-content: space-around; }
  .bnav button { flex: 1; border: 0; background: transparent; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 11px; color: var(--text-secondary); padding: 4px 0; cursor: pointer; }
  .bnav button[aria-current="page"] { color: var(--brand-primary); font-weight: 600; }
  .bnav .ico { width: 20px; height: 20px; }
  main { padding-bottom: 96px; }
  .g4 { grid-template-columns: 1fr 1fr; gap: 12px; }
  .g4 .card { padding: 14px; } .g4 .big { font-size: 19px; }
  .hero .big { font-size: 30px; }
  .checks { grid-template-columns: 1fr; }
  .todo { flex-wrap: wrap; }
}

.bar > span.over { background: var(--danger); }

.grid > * { min-width: 0; }
.seg button { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
@media (max-width: 640px) { .seg button { font-size: 13px; padding: 7px 4px; } .page-head .seg { max-width: 100%; } }

.gauge { position: relative; flex-shrink: 0; }
.gauge svg { width: 100%; height: 100%; display: block; }
.gauge .g-lbl { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
.gauge .g-num { font-size: 30px; font-weight: 600; line-height: 1; }
.hero .ico { vertical-align: -3px; }
.hero-link { color: #fff; text-decoration: underline; text-underline-offset: 3px; font-size: 13px; }
.steps { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 12px; }
.steps li { display: flex; align-items: flex-start; gap: 12px; }
.step-ico { width: 32px; height: 32px; border-radius: var(--corner-md); background: rgba(255,255,255,0.15); display: grid; place-items: center; flex-shrink: 0; }
.hero .hero-btn { color: #fff; }
.hero .hero-btn:hover { background: rgba(255,255,255,0.15); color: #fff; }
.hero .hero-btn[disabled] { opacity: .7; cursor: default; }
.hero :focus-visible { outline-color: #fff; }

.span2 > .card { height: 100%; }

.hero-title { background: none; border: 0; padding: 0; color: #fff; cursor: pointer; display: inline-flex; align-items: center; gap: 4px; font-size: 13px; text-align: left; }
.hero-title:hover { color: #fff; }
.spark { width: 100%; height: 28px; display: block; margin-top: 14px; }
.spark-key { display: flex; align-items: center; gap: 6px; margin-top: 4px; }
.spark-key i { display: inline-block; width: 12px; height: 2px; background: rgba(255,255,255,0.95); }
.spark-key i.out { background: rgba(255,255,255,0.45); margin-left: 8px; }
.comp-bar { display: flex; height: 14px; border-radius: 999px; overflow: hidden; gap: 2px; }
.comp-bar span { display: block; height: 100%; }
.wg-break { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 8px; font-size: 12px; color: var(--text-secondary); }
.wg-break span { display: inline-flex; align-items: center; gap: 5px; }
.wg-break i { width: 8px; height: 8px; border-radius: 2px; display: inline-block; }
.wg-break b { color: var(--text-primary); font-weight: 600; }
.cost-form { display: flex; gap: 12px; align-items: flex-end; flex-wrap: wrap; margin-bottom: 8px; }
.cost-form input { border: 1px solid var(--border-primary); background: var(--surface-bg); border-radius: var(--corner-md); padding: 9px 12px; width: 100%; min-width: 0; }
.cost-form .money input { padding-left: 26px; }
#costErr { margin-bottom: 8px; }
.insight { display: flex; align-items: flex-start; gap: 12px; padding: 14px; border-radius: var(--corner-md); background: var(--bg-faint); }
.back { margin-bottom: 8px; margin-left: -10px; }
.model-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 2fr); gap: 28px; }
.slider label { font-weight: 500; }
.slider input[type=range] { width: 100%; accent-color: var(--brand-primary); }
.sl-num { display: inline-flex; align-items: center; gap: 4px; }
.sl-num input { width: 96px; border: 1px solid var(--border-primary); background: var(--surface-bg); border-radius: 8px; padding: 5px 8px; text-align: right; }
.proj-read { margin-bottom: 6px; } .proj-read #projVal { font-weight: 600; font-size: 16px; }
@media (max-width: 900px) { .model-grid { grid-template-columns: 1fr; } }
@media (max-width: 640px) { .cost-form .field { width: 100% !important; flex: 1 1 100% !important; } .cost-form .btn { width: 100%; justify-content: center; } }

.card { box-shadow: 0 1px 3px rgba(43,31,40,0.06); }
.tile .num { white-space: nowrap; }

.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.chat-card h2 .ico { color: var(--brand-primary); vertical-align: -2px; }
.chat-log { max-height: 440px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; padding: 4px 2px 12px; }
.msg { max-width: 85%; padding: 10px 14px; border-radius: 16px; line-height: 1.5; }
.msg p { margin: 0 0 6px; } .msg p:last-child { margin-bottom: 0; }
.msg ul { margin: 4px 0 6px; padding-left: 18px; } .msg li { margin: 2px 0; }
.msg.me { align-self: flex-end; background: var(--brand-primary); color: var(--on-brand); border-bottom-right-radius: 4px; }
.msg.ai { align-self: flex-start; background: var(--bg-faint); border-bottom-left-radius: 4px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { border: 1px solid var(--border-primary); background: var(--surface-bg); border-radius: 999px; padding: 7px 12px; cursor: pointer; font-size: 13px; }
.chip:hover { background: var(--surface-hover); border-color: var(--brand-secondary); }
.chat-form { display: flex; gap: 8px; align-items: flex-end; border-top: 1px solid var(--border-primary); padding-top: 12px; }
.chat-form textarea { flex: 1; min-width: 0; resize: none; border: 1px solid var(--border-primary); background: var(--surface-bg); border-radius: var(--corner-md); padding: 9px 12px; font: inherit; color: inherit; }
.chat-card .faint .ico { width: 13px; height: 13px; vertical-align: -2px; }
pre.shared { white-space: pre-wrap; font-size: 12px; background: var(--bg-faint); border-radius: var(--corner-md); padding: 12px; max-height: 50vh; overflow: auto; margin: 0; }
@media (min-width: 1500px) { .g2.wide-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); } }

/* Sign-in */
.auth { min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; }
.auth-card { background: var(--surface-bg); border-radius: var(--corner-lg); padding: 32px 28px; width: min(420px, 100%); box-shadow: var(--shadow); }
.auth-card .mark { width: 40px; height: 40px; border-radius: 12px; background: var(--brand-primary); color: var(--on-brand); display: grid; place-items: center; font-weight: 700; margin-bottom: 14px; }
.auth-card h1 { margin-bottom: 18px; }
.auth-card form { display: flex; flex-direction: column; gap: 14px; }
.auth-btn { justify-content: center; width: 100%; padding: 11px 14px; }
.qr { display: grid; place-items: center; background: #fff; border-radius: var(--corner-md); padding: 12px; margin-bottom: 10px; }
.qr img { width: 180px; height: 180px; }
code.secret { word-break: break-all; font-size: 12px; background: var(--bg-faint); padding: 2px 6px; border-radius: 6px; }
/* Form fields need a visible edge, so empty boxes don't vanish */
.field input, .field select, .add-row input, .filters input, .filters select, .cost-form input, .sl-num input, .chat-form textarea { border-color: var(--border-input); }
/* The app icon (house and seedling) is the logo on the sign-in card and the sidebar */
.rail img.mark, .auth-card img.mark { display: block; background: none; border-radius: 0; }
/* "Removed · Undo" note after a one-tap removal */
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: 24px; z-index: 30; display: flex; align-items: center; gap: 16px; max-width: calc(100vw - 32px); padding: 12px 18px; border-radius: 999px; background: #2b1f28; color: #fff; box-shadow: var(--shadow); font-size: 14px; }
.toast span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.toast .link { color: #f7a8cd; font-weight: 600; flex-shrink: 0; padding: 6px 2px; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .toast { background: #f6eaf0; color: #2b1f28; } :root:not([data-theme="light"]) .toast .link { color: #b3005e; } }
:root[data-theme="dark"] .toast { background: #f6eaf0; color: #2b1f28; }
:root[data-theme="dark"] .toast .link { color: #b3005e; }
@media (max-width: 640px) { .toast { bottom: calc(76px + env(safe-area-inset-bottom, 0px)); } }
.not-bill { font-size: 12px; }
.cost-name { background: none; border: 0; padding: 0; font: inherit; color: inherit; text-align: left; cursor: pointer; text-decoration: underline; text-decoration-color: var(--border-input); text-underline-offset: 3px; }
.cost-name:hover { color: var(--brand-primary); }
.nowrap { white-space: nowrap; }
.due-list { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 2px; }
</style>
</head>
<body>
<div class="app">
  <nav class="rail" aria-label="Main">
    <img class="mark" src="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 512 512%22%3E %3Cdefs%3E %3ClinearGradient id=%22bg%22 x1=%220%22 y1=%220%22 x2=%221%22 y2=%221%22%3E %3Cstop offset=%220%22 stop-color=%22%23c0126f%22/%3E %3Cstop offset=%221%22 stop-color=%22%23d0306a%22/%3E %3C/linearGradient%3E %3C/defs%3E %3Crect width=%22512%22 height=%22512%22 rx=%22112%22 fill=%22url%28%23bg%29%22/%3E %3Cg fill=%22%23f7a8cd%22%3E %3Cpath d=%22M256 160 C246 118 206 96 158 104 C166 150 208 172 256 160 Z%22/%3E %3Cpath d=%22M256 160 C266 118 306 96 354 104 C346 150 304 172 256 160 Z%22/%3E %3C/g%3E %3Cpath d=%22M256 158 V196%22 stroke=%22%23f7a8cd%22 stroke-width=%2212%22 stroke-linecap=%22round%22 fill=%22none%22/%3E %3Cpath d=%22M130 278 L256 186 L382 278%22 stroke=%22%23f9bd45%22 stroke-width=%2230%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22 fill=%22none%22/%3E %3Cpath d=%22M256 222 L340 284 V388 H172 V284 Z%22 fill=%22%23f9bd45%22 stroke=%22%23f9bd45%22 stroke-width=%2218%22 stroke-linejoin=%22round%22/%3E %3C/svg%3E" alt="" width="36" height="36">
    <button class="rail-btn" data-page="home" aria-label="Home"><svg class="ico"><use href="#i-home"/></svg></button>
    <button class="rail-btn" data-page="transactions" aria-label="Spending"><svg class="ico"><use href="#i-list"/></svg></button>
    <button class="rail-btn" data-page="family" aria-label="Family accounts"><svg class="ico"><use href="#i-users"/></svg></button>
    <button class="rail-btn" data-page="strategy" aria-label="Financial strategy"><svg class="ico"><use href="#i-compass"/></svg></button>
    <button class="rail-btn" data-page="wealth" aria-label="Wealth balance sheet"><svg class="ico"><use href="#i-chart"/></svg></button>
    <div class="spacer"></div>
    <button class="rail-btn" data-action="settings" aria-label="Household settings"><svg class="ico"><use href="#i-sliders"/></svg></button>
    <div class="avatar" id="meAvatar" aria-hidden="true"></div>
  </nav>

  <main>
    <div id="notice" class="notice" hidden></div>
    <div id="root"><p class="loading">Loading your figures…</p></div>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden><span id="toastMsg"></span><button type="button" class="link" id="toastUndo">Undo</button></div>
  <nav class="bnav" aria-label="Main">
    <button data-page="home"><svg class="ico"><use href="#i-home"/></svg>Home</button>
    <button data-page="transactions"><svg class="ico"><use href="#i-list"/></svg>Spending</button>
    <button data-page="family"><svg class="ico"><use href="#i-users"/></svg>Family</button>
    <button data-page="strategy"><svg class="ico"><use href="#i-compass"/></svg>Strategy</button>
    <button data-page="wealth"><svg class="ico"><use href="#i-chart"/></svg>Wealth</button>
  </nav>
</div>

<!-- Wealth: add / edit item -->
<dialog id="itemDlg" aria-labelledby="itemTitle">
  <form id="itemForm" novalidate>
    <div class="dlg-head">
      <h2 id="itemTitle">Add</h2>
      <button type="button" class="icon-btn" data-close aria-label="Close"><svg class="ico"><use href="#i-x"/></svg></button>
    </div>
    <div class="dlg-body">
      <div class="value-top" id="valueTop" hidden>
        <div class="row-between"><h3 id="valueMonth">Update</h3><p class="sm muted" id="valueStep" hidden><span id="stepCount"></span> · <button type="button" class="link" id="skipBtn">Skip for now</button></p></div>
        <div class="value-keep" id="valueKeep" hidden><button type="button" class="btn btn-neutral" id="keepBtn">Keep</button><span class="sm muted" id="keepNote"></span></div>
      </div>
      <h3 class="details-head" id="detailsHead" hidden>Details</h3>
      <div class="field"><label for="f-group">Type</label><select id="f-group"></select></div>
      <div class="field" data-for="isa">
        <label for="f-isaType">ISA type</label>
        <select id="f-isaType">
          <option value="ss">Stocks &amp; shares ISA</option>
          <option value="cash">Cash ISA</option>
          <option value="lisa">Lifetime ISA</option>
          <option value="jisa">Junior ISA</option>
        </select>
      </div>
      <div class="field"><label for="f-name">Name</label><input id="f-name" autocomplete="off" required></div>
      <div class="two">
        <div class="field"><label for="f-provider" id="l-provider">Provider</label><input id="f-provider" autocomplete="off"></div>
        <div class="field" id="ownerField"><label for="f-owner">Whose is it?</label><select id="f-owner"></select></div>
        <div class="field" id="childField" hidden><label for="f-child">Child's name</label><input id="f-child" autocomplete="off"></div>
      </div>
      <div class="field" id="valueField">
        <label for="f-value" id="l-value">Current value</label>
        <div class="money"><input id="f-value" inputmode="decimal" autocomplete="off"></div>
        <p class="hint" id="valueHint" hidden></p>
        <p class="sm value-chg" id="valueChg" aria-live="polite" hidden></p>
        <p class="err" id="valueErr" hidden>Enter an amount, like 12500.</p>
      </div>
      <div id="valueSlot" hidden></div>
      <div class="field" data-for="isa" id="contribField">
        <label for="f-contrib">Paid in this tax year</label>
        <div class="money"><input id="f-contrib" inputmode="decimal" autocomplete="off"></div>
        <p class="hint" id="contribHint"></p>
        <p class="hint" id="contribAsOf" hidden></p>
      </div>
      <div id="contribSlot" hidden></div>
      <div class="field" data-for="pension">
        <label for="f-pmonthly">Paid in each month (yours plus employer's)</label>
        <div class="money"><input id="f-pmonthly" inputmode="decimal" autocomplete="off"></div>
        <p class="hint">It's on your payslip or pension app. Leave blank if you're not sure.</p>
      </div>

  try { start(); } catch (e) { console.error(e); }
})();
